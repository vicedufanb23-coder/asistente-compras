<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a2e"/>
      <stop offset="100%" style="stop-color:#003d5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Cart body -->
  <path d="M140 180 L170 340 L350 340 L380 200 L190 200" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cart handle -->
  <path d="M140 180 L110 150" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
  <!-- Cart wheels -->
  <circle cx="200" cy="370" r="22" fill="url(#accent)"/>
  <circle cx="320" cy="370" r="22" fill="url(#accent)"/>
  <!-- Calculator symbol (= sign in the cart) -->
  <line x1="230" y1="250" x2="310" y2="250" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="230" y1="290" x2="310" y2="290" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <!-- Dollar sign -->
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#10b981" opacity="0.7">$</text>
</svg>
